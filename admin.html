<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusFood Admin</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#fff7ed;color:#333}
header{background:#ff6b00;color:white;text-align:center;padding:18px}
.container{max-width:800px;margin:auto;padding:15px}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary div{background:white;padding:15px;border-radius:10px;flex:1;min-width:130px;box-shadow:0 2px 5px #ddd}
.order{background:white;padding:15px;margin:12px 0;border-radius:10px;box-shadow:0 2px 5px #ccc;overflow-wrap:anywhere}
button{background:#ff6b00;color:white;border:0;border-radius:6px;padding:10px;margin:4px;cursor:pointer}
.delete{background:#d32f2f}
.status{font-weight:bold;color:#e65100}
nav{text-align:center;padding:12px;background:white}
nav a{color:#ff6b00;margin:8px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header><h1>CampusFood</h1><p>Admin Panel</p></header>
<nav><a href="menu.html">Food Menu</a><a href="index.html">Home</a></nav>
<div class="container">
<h2>Order Dashboard</h2>
<div class="summary">
<div><h3>Total Orders</h3><strong id="count">0</strong></div>
<div><h3>Total Sales</h3><strong id="sales">PHP 0.00</strong></div>
</div>
<button onclick="showOrders()">Refresh Orders</button>
<button onclick="exportCSV()">Export to Excel (CSV)</button>
<div id="orders"></div>
</div>
<script>
function getOrders(){
try{return JSON.parse(localStorage.getItem("campusfood_orders")||"[]")}
catch(e){return[]}
}
function showOrders(){
let box=document.getElementById("orders");
box.innerHTML="";
let orders=getOrders();
document.getElementById("count").textContent=orders.length;
document.getElementById("sales").textContent="PHP "+orders.reduce((sum,o)=>sum+Number(o.total||0),0).toFixed(2);
if(!orders.length){box.textContent="No orders saved on this device yet.";return}
orders.slice().reverse().forEach(o=>{
let card=document.createElement("div");
card.className="order";
let title=document.createElement("h3");
title.textContent="Order #"+o.id;
let details=document.createElement("p");
details.textContent="Customer: "+o.customer+" | Date: "+o.date;
let items=document.createElement("p");
items.textContent="Items: "+(o.items||[]).map(i=>i.name+" x "+i.qty).join(", ");
let total=document.createElement("p");
total.textContent="Total: PHP "+Number(o.total||0).toFixed(2);
let status=document.createElement("p");
status.className="status";
status.textContent="Status: "+o.status;
let btn=document.createElement("button");
btn.textContent=o.status==="Completed"?"Completed":"Mark Completed";
btn.disabled=o.status==="Completed";
btn.onclick=()=>{
let all=getOrders(),i=all.findIndex(x=>x.id===o.id);
if(i>=0){all[i].status="Completed";localStorage.setItem("campusfood_orders",JSON.stringify(all));showOrders()}
};
let del=document.createElement("button");
del.className="delete";
del.textContent="Delete Order";
del.onclick=()=>{
if(confirm("Delete this order?")){
localStorage.setItem("campusfood_orders",JSON.stringify(getOrders().filter(x=>x.id!==o.id)));
showOrders();
}
};
card.append(title,details,items,total,status,btn,del);
box.appendChild(card);
});
}
function exportCSV(){
let orders=getOrders();
if(!orders.length){alert("No orders to export.");return}
const quote=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
let rows=[
["Order ID","Customer","Date","Food Items","Total PHP","Status"],
...orders.map(o=>[
o.id,o.customer,o.date,
(o.items||[]).map(i=>i.name+" x "+i.qty).join("; "),
Number(o.total||0).toFixed(2),o.status
])
];
let csv="\uFEFF"+rows.map(r=>r.map(quote).join(",")).join("\r\n");
try{
let file=new File([csv],"CampusFood_Orders.csv",{type:"text/csv;charset=utf-8"});
let url=URL.createObjectURL(file);
let a=document.createElement("a");
a.href=url;
a.download="CampusFood_Orders.csv";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}catch(e){
alert("Automatic download is not supported in this browser. Open this page in Chrome and try again.");
}
}
showOrders();
</script>
</body>
</html>
