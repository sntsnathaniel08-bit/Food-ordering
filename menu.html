<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusFood - Menu</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#ff6b00;color:white;text-align:center;padding:20px}nav{text-align:center;background:white;padding:15px}nav a{margin:8px;color:#ff6b00;text-decoration:none;font-weight:bold}.container{max-width:700px;margin:auto;padding:20px}.food,.cart{background:white;padding:15px;margin:12px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}button{background:#ff6b00;color:white;border:0;border-radius:6px;padding:9px 13px;margin:3px}.remove{background:#d32f2f}.total{font-size:20px;font-weight:bold}input{width:95%;padding:10px;margin:8px 0}</style></head><body><header><h1>CampusFood</h1><p>Food Menu</p></header><nav><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="orders.html">My Orders</a><a href="login.html">Admin</a></nav><div class="container"><h2>🍔 Available Food</h2><div id="foodList"></div><div class="cart"><h2>🛒 Your Cart</h2><label for="customer">Your name</label><input id="customer" placeholder="Enter your name" maxlength="100"><div id="cartList">Your cart is empty.</div><p class="total">Total: PHP <span id="total">0.00</span></p><button id="checkout">Place Order</button></div></div><script>
const foods=[["Chicken Rice",65],["Burger",50],["French Fries",35],["Spaghetti",60],["Iced Tea",25],["Chicken Adobo with Rice",75],["Pork Menudo with Rice",80],["Pork Sinigang with Rice",85],["Chicken Tinola with Rice",75],["Bistek Tagalog with Rice",85],["Pork Giniling with Rice",70],["Fried Bangus with Rice",80],["Lumpiang Shanghai with Rice",65],["Tapsilog",85],["Longsilog",75],["Tocilog",75],["Pork BBQ with Rice",80],["Pork Sisig with Rice",85],["Kare-Kare with Rice",100],["Pinakbet with Rice",65]];
let cart=[];
const $=id=>document.getElementById(id);
function getOrders(){try{return JSON.parse(localStorage.getItem("campusfood_orders")||"[]")}catch(e){return[]}}
function showCart(){$("cartList").innerHTML="";if(!cart.length){$("cartList").textContent="Your cart is empty."; $("total").textContent="0.00";return}let sum=0;cart.forEach((item,i)=>{sum+=item.price*item.qty;let row=document.createElement("div"),p=document.createElement("p");p.textContent=item.name+" - PHP "+item.price+" x "+item.qty;row.append(p);[["-",()=>changeQty(i,-1)],["+",()=>changeQty(i,1)],["Remove",()=>{cart.splice(i,1);showCart()}]].forEach(([label,fn])=>{let b=document.createElement("button");b.textContent=label;if(label==="Remove")b.className="remove";b.onclick=fn;row.append(b)});$("cartList").append(row)});$("total").textContent=sum.toFixed(2)}
function changeQty(i,n){if(!cart[i])return;cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);showCart()}
foods.forEach(food=>{let box=document.createElement("div");box.className="food";let h=document.createElement("h3");h.textContent=food[0];let p=document.createElement("p");p.textContent="PHP "+food[1].toFixed(2);let b=document.createElement("button");b.textContent="Add to Cart";b.onclick=()=>{let item=cart.find(x=>x.name===food[0]);if(item)item.qty++;else cart.push({name:food[0],price:food[1],qty:1});showCart()};box.append(h,p,b);$("foodList").append(box)});
$("checkout").onclick=()=>{if(!cart.length)return alert("Your cart is empty.");let name=$("customer").value.trim();if(!name)return alert("Please enter your name.");let orders=getOrders();let order={id:Date.now(),customer:name,items:cart.map(x=>({...x})),total:cart.reduce((s,x)=>s+x.price*x.qty,0),status:"Pending",date:new Date().toLocaleString()};orders.push(order);try{localStorage.setItem("campusfood_orders",JSON.stringify(orders));alert("Order saved on this device! Order number: "+order.id);cart=[];showCart();$("customer").value=""}catch(e){alert("Could not save order. Check your phone storage.")}};
showCart();
</script></body></html>
